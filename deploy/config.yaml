# =============================================================================
# Coding Dashboard - Agent configuration
# Read by the backend (path via CD_AGENTS_CONFIG_PATH, usually
# /etc/coding-dashboard/config.yaml).
#
# Placeholders substituted at runtime:
#   {prompt}       -> the task description (incl. AGENTS.md instruction)
#   {project_dir}  -> the local path of the cloned project repo
#
# command : argv list (NO shell). Token 0 is the binary.
# prompt_via : "arg"  -> {prompt} is inserted into the arguments
#              "stdin" -> prompt is written to stdin (no {prompt} needed)
# stream_format : "claude-json" (Claudes --output-format stream-json) | "raw"
# goal_command : optional. Template for "goal" mode (/goal). If set,
#                you can give the agent a goal instead of a task; the
#                entire history until the goal counts as a single task. {prompt} is the
#                goal. If the field is missing, the agent does not offer goal mode.
# =============================================================================

# Instruction appended to EVERY task so Claude, Hermes and Codex know
# AGENTS.md to maintain a shared project context.
context_instruction: |
  Important project context (always observe):
  1. First read the `AGENTS.md` file in the project root directory, if it exists,
     to understand the structure, tech stack, past decisions, and the current state.
  2. Then complete the task described above thoroughly and cleanly.
  3. Afterwards update `AGENTS.md` (create it if it doesn't exist): describe
     concisely and up-to-date the project structure, the tech stack, decisions
     made, the current state, and open items / next steps -- so that another AI agent
     (Claude Code, Hermes or Codex) immediately understands the project
     and can continue seamlessly.
  4. Do NOT commit or push yourself -- the dashboard handles this automatically after the task.

agents:
  claude:
    display_name: "Claude Code"
    # __CLAUDE_BIN__ is replaced by the installer with the absolute path.
    command:
      - "claude"
      - "-p"
      - "{prompt}"
      - "--output-format"
      - "stream-json"
      - "--verbose"
      - "--dangerously-skip-permissions"
    prompt_via: arg
    stream_format: claude-json
    # Enables the "goal" mode: the dashboard calls Claude with "/goal <goal>".
    goal_command: "/goal {prompt}"
    enabled: true
    # timeout_seconds: 3600

  hermes:
    display_name: "Hermes"
    # `hermes chat -q "<prompt>"`: single, non-interactive query that
    # streams intermediate steps (tool previews) LIVE. --yolo skips approvals,
    # --accept-hooks runs headless. AGENTS.md is auto-loaded from the CWD.
    command:
      - "hermes"
      - "chat"
      - "-q"
      - "{prompt}"
      - "--yolo"
      - "--accept-hooks"
    prompt_via: arg
    stream_format: raw
    enabled: true
    env:
      HERMES_ACCEPT_HOOKS: "1"   # Accept shell hooks headless
      NO_COLOR: "1"              # suppress color codes (clean web console)
    # Prevents PYTHONPATH/PYTHONHOME from the backend venv from interfering with
    # the (Python) Hermes CLI (matches the hermes wrapper, which empties these vars).
    unset_env:
      - "PYTHONPATH"
      - "PYTHONHOME"
    # Alternative (only the final result, no live stream, quietest):
    #   command: ["hermes", "-z", "{prompt}"]

  codex:
    display_name: "Codex"
    # `codex exec`: single, non-interactive task. "-" reads the prompt
    # from stdin so long dashboard prompts do not land in the process list.
    # workspace-write + ask-for-approval never runs headless, without disabling the
    # approvals completely.
    command:
      - "codex"
      - "exec"
      - "--cd"
      - "{project_dir}"
      - "--sandbox"
      - "workspace-write"
      - "--ask-for-approval"
      - "never"
      - "--color"
      - "never"
      - "--ephemeral"
      - "-"
    prompt_via: stdin
    stream_format: raw
    enabled: true
    env:
      NO_COLOR: "1"
    unset_env:
      - "PYTHONPATH"
      - "PYTHONHOME"
